name: MySQLMacClient
options:
  bundleIdPrefix: com.sedattokay
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

# A third configuration, alongside the default Debug/Release, dedicated to
# `scripts/build-dmg.sh`'s direct-download DMG — it needs Developer ID
# Application signing, which must NOT live on "Release" itself (that's
# what Product ▸ Archive / App Store Connect uploads use, and that path
# needs Apple Distribution instead). Keeping them as separate named
# configs — rather than command-line CODE_SIGN_IDENTITY overrides on
# `xcodebuild -configuration Release` — avoids a real failure mode: a
# command-line override applies to *every* target in the build graph,
# including the SPM package dependency targets (swift-crypto, swift-nio,
# ...), which then fail with "requires a development team" since they're
# never meant to be independently signed at all.
configs:
  Debug: debug
  Release: release
  DeveloperID: release

packages:
  # Kept in lockstep with Package.swift: a fork of vapor/mysql-nio 1.9.1
  # pinned to an exact revision, adding CLIENT_MULTI_RESULTS + multi-result-set
  # draining so CALLing a procedure that returns a SELECT works (upstream
  # fails it with ER_SP_BADSELECT).
  mysql-nio:
    url: https://github.com/stokay/mysql-nio.git
    revision: a637f93245d7b01cb9f2ca86024b9b7d2a3a137a

targets:
  MySQLMacClient:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources/MySQLMacClient
      # .xcassets in sources gets compiled into Assets.car by Xcode —
      # `assets:` is not a valid XcodeGen key, which is why the first
      # upload shipped without an asset catalog (ITMS-90546).
      - Assets.xcassets
    resources:
      - path: Sources/MySQLMacClient/Resources
        type: copy
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "MySQL Client"
        CFBundleShortVersionString: "1.7.0"
        CFBundleVersion: "14"
        LSApplicationCategoryType: "public.app-category.developer-tools"
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: "Copyright © 2025 Sedat Tokay. All rights reserved."
        # Muaf olmayan şifreleme yok — App Store Connect'in her build'de
        # sorduğu ihracat beyanını kalıcı olarak cevaplar.
        ITSAppUsesNonExemptEncryption: false
    # XcodeGen bu dosyayı properties'ten ÜRETİR — izinler burada durmalı;
    # dosyayı elle düzenlemek bir sonraki generate'te kaybolur.
    entitlements:
      path: MySQLMacClient.entitlements
      properties:
        # App Store'daki tüm macOS uygulamaları için zorunlu.
        com.apple.security.app-sandbox: true
        # Dışarıya TCP (MySQL sunucularına bağlantı) — sandbox altında bu
        # izin olmadan hiçbir bağlantı kurulamaz.
        com.apple.security.network.client: true
        # NSOpenPanel/NSSavePanel ile kullanıcının seçtiği dosyalara (Table
        # Export/Import, DB Backup) erişim — bu izin olmadan sandbox'lı bir
        # build'de Powerbox paneli hiç açılmıyor (swift run'da fark
        # edilmiyor çünkü o build gerçekten sandbox'lı değil).
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sedattokay.MySQLMacClient
        # Gerçek Team ID (sertifikanın OU alanı) — CN'deki parantez içi
        # (UR6S53DFBX) kişisel kimliktir, takım kimliği değildir.
        DEVELOPMENT_TEAM: 848JB749D8
        # İkinci 5.2.5 reddi, CFBundleDisplayName'in tek başına yetmediğini
        # gösterdi: Dock/Finder tooltip'i "MySQLMacClient" (boşluksuz)
        # gösteriyordu — bu CFBundleName/PRODUCT_NAME'den geliyor, hedefin
        # YAML anahtarından (MySQLMacClient, şemalar/referanslar için aynı
        # kalıyor) ayrı bir build ayarı. Bunu değiştirmek .app dosya adını
        # ve CFBundleName'i (Info.plist'te $(PRODUCT_NAME) olarak zaten
        # bağlı) "MySQL Client" yapar, Bundle ID'ye dokunmaz.
        PRODUCT_NAME: "MySQL Client"
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "14"
        ENABLE_HARDENED_RUNTIME: YES
        # Extracts every `Text("…")` / `String(localized:)` literal into
        # Localizable.xcstrings during the build, so the catalog stays in
        # sync with the code instead of being hand-maintained.
        SWIFT_EMIT_LOC_STRINGS: YES
        # Automatic on Debug only — Xcode's "pick the right cert per
        # action" behavior for Automatic signing turned out to only be
        # reliable from Xcode's own GUI Archive flow; a plain command-line
        # `xcodebuild archive -configuration Release` signed with Apple
        # Development instead of Apple Distribution (verified empirically
        # 2026-08-09). Release now pins Apple Distribution explicitly
        # below, the same way DeveloperID pins Developer ID Application —
        # no more ambiguity regardless of how the archive is triggered.
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # App Store Connect uploads (Product ▸ Archive, or a command-line
        # `xcodebuild archive -configuration Release`) need Apple
        # Distribution specifically — Automatic signing style doesn't
        # reliably resolve to it outside Xcode's own GUI archive flow (see
        # comment above), so it's pinned explicitly instead.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
        # `scripts/build-dmg.sh` builds this config exclusively, for a
        # direct-download DMG that must pass Gatekeeper on someone else's
        # Mac — Developer ID Application is the only identity that works
        # for that (App Sandbox + notarization). Scoped as a real
        # configuration (not a command-line override on top of Release)
        # because a command-line CODE_SIGN_IDENTITY override applies to
        # *every* target in the build graph, including the SPM package
        # dependency targets (swift-crypto, swift-nio, ...) — those then
        # fail with "requires a development team", since they're never
        # meant to be independently signed at all.
        DeveloperID:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          # Automatic/Development-style signing defaults to `--timestamp=none`
          # (faster local builds) — notarization rejects a signature without
          # a secure timestamp, so this has to force a real one.
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # `xcodebuild build` (as opposed to `archive`) auto-injects
          # com.apple.security.get-task-allow — a debugger-attach
          # entitlement — into the signed binary regardless of
          # configuration. Apple's notary service rejects any submission
          # that has it ("Archive contains critical validation errors").
          # This setting is what actually stops the injection.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Belt-and-braces for ITMS-91109: strips quarantine/metadata xattrs
    # from everything inside the built .app before Xcode signs it, so a
    # freshly-downloaded icon can never poison an archive again.
    postBuildScripts:
      - name: Strip extended attributes
        script: |
          xattr -cr "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}" || true
        basedOnDependencyAnalysis: false
    dependencies:
      - package: mysql-nio
        product: MySQLNIO

  MySQLMacClientTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MySQLMacClientTests
    dependencies:
      - target: MySQLMacClient

schemes:
  MySQLMacClient:
    build:
      targets:
        MySQLMacClient: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MySQLMacClientTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
